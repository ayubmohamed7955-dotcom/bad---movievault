$kind: http-request
url: "{{baseUrl}}/api/movies/{{createdMovieId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 204 No Content", () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
