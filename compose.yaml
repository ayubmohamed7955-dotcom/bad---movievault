# MovieVault - hele systemet
# Start:  docker compose up --build
# Værdierne ${...} kommer fra .env (kopiér .env.example til .env og udfyld)
#
# Containerne taler sammen via service-navne (sqlserver, mongodb, api) på Compose-netværket.
# "localhost" inde i en container er containeren selv - derfor bruger simulatoren http://api:8080.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "14333:1433"          # kun til at kigge i databasen fra værtsmaskinen
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"         # 27018 på værten, så den ikke støder sammen med en lokal MongoDB
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: MovieVault.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # holder /scalar og /openapi/v1.json tilgængelige
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MovieVault;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      RequestLogging__MongoUrl: "mongodb://mongodb:27017/MovieVaultLogs"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      DemoUsers__Actor__Password: ${DEMO_ACTOR_PASSWORD}
      DemoUsers__Director__Password: ${DEMO_DIRECTOR_PASSWORD}
      DemoUsers__Reviewer__Password: ${DEMO_REVIEWER_PASSWORD}
      DemoUsers__Admin__Password: ${DEMO_ADMIN_PASSWORD}
      ServiceAccount__UserName: ${SERVICE_ACCOUNT_USERNAME}
      ServiceAccount__Password: ${SERVICE_ACCOUNT_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: MovieVault.Simulator/Dockerfile
    environment:
      MovieVaultApi__BaseUrl: "http://api:8080"
      ServiceAccount__UserName: ${SERVICE_ACCOUNT_USERNAME}
      ServiceAccount__Password: ${SERVICE_ACCOUNT_PASSWORD}
      Simulator__IntervalSeconds: ${SIMULATOR_INTERVAL_SECONDS:-15}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver-data:
  mongodb-data:
